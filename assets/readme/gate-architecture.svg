<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <title>workflow-gate 门控链路：触发层(extension) → 门控层(MCP server) → 状态层(workflow.json/state.json/audit.log)</title>
  <rect width="1200" height="400" rx="22" fill="#0B0E11"/>
  <text x="64" y="72" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="22" fill="#E8ECEF">门控链路 · 三模块</text>
  <text x="64" y="100" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#8B95A1">触发（不裁决） → 门控（定阶段） → 状态（存证据）</text>

  <!-- 模块 1：触发层 -->
  <g>
    <rect x="64" y="140" width="320" height="180" rx="18" fill="#10151A" stroke="#2A323C" stroke-width="2"/>
    <text x="92" y="180" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18" fill="#3DDC97">① 触发层</text>
    <text x="92" y="210" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#B8C1C9">extensions/workflow-gate/index.ts</text>
    <text x="92" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8B95A1">粗筛候选 → 提醒确认任务实质</text>
    <text x="92" y="264" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8B95A1">豁免语 / pause / 进行中只提示进度</text>
  </g>
  <!-- 模块 2：门控层 -->
  <g>
    <rect x="440" y="140" width="320" height="180" rx="18" fill="#10151A" stroke="#3DDC97" stroke-width="2"/>
    <text x="468" y="180" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18" fill="#3DDC97">② 门控层</text>
    <text x="468" y="210" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#B8C1C9">workflow_gate_mcp.py</text>
    <text x="468" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8B95A1">wf_begin / wf_check / wf_status</text>
    <text x="468" y="264" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8B95A1">wf_notes / wf_reset · 顺序门控</text>
  </g>
  <!-- 模块 3：状态层 -->
  <g>
    <rect x="816" y="140" width="320" height="180" rx="18" fill="#10151A" stroke="#2A323C" stroke-width="2"/>
    <text x="844" y="180" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18" fill="#3DDC97">③ 状态层</text>
    <text x="844" y="210" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#B8C1C9">workflow/ 三文件</text>
    <text x="844" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8B95A1">workflow.json 规则表</text>
    <text x="844" y="264" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8B95A1">state.json 进度 · audit.log 证据</text>
  </g>
  <!-- 箭头 -->
  <g stroke="#4A5560" stroke-width="2" fill="none">
    <line x1="384" y1="230" x2="430" y2="230"/>
    <path d="M426 224 l6 6 l-6 6"/>
    <line x1="760" y1="230" x2="806" y2="230"/>
    <path d="M802 224 l6 6 l-6 6"/>
  </g>
  <!-- 门禁闸机 motif -->
  <g>
    <rect x="410" y="352" width="380" height="4" rx="2" fill="#3DDC97"/>
    <rect x="432" y="340" width="10" height="34" rx="3" fill="#3DDC97"/>
    <rect x="758" y="340" width="10" height="34" rx="3" fill="#3DDC97"/>
    <text x="470" y="378" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#8B95A1">每完成一个阶段，wf_check 放行一格</text>
  </g>
</svg>
